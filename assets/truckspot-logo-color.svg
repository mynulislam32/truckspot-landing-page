<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 120" width="100%" height="100%">
  <defs>
    <!-- Vibrant Appetizing Gradients -->
    <linearGradient id="truckSpotPinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6A3D"/>
      <stop offset="100%" stop-color="#FF5722"/>
    </linearGradient>
    <linearGradient id="truckSpotGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD54F"/>
      <stop offset="100%" stop-color="#FFC107"/>
    </linearGradient>
    <filter id="subtlePinShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#FF5722" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- ================= LOGOMARK: THE LOCATION PIN FOOD TRUCK ================= -->
  <g transform="translate(12, 10)" filter="url(#subtlePinShadow)">
    <!-- Aerodynamic GPS Location Pin Contour -->
    <path d="M 50,4 C 29.5,4 13,20.5 13,41 C 13,64 45.8,92.6 48.2,94.7 C 49.3,95.6 50.7,95.6 51.8,94.7 C 54.2,92.6 87,64 87,41 C 87,20.5 70.5,4 50,4 Z" 
          fill="url(#truckSpotPinGrad)"/>

    <!-- Negative-Space Food Truck Silhouette -->
    <!-- Aerodynamic Truck Body -->
    <path d="M 26,38 C 26,35 28,33 31,33 L 56,33 C 58.5,33 60.5,34.5 61.5,36.5 L 68.5,45.5 C 69.5,46.8 70,48.2 70,50 L 70,60 C 70,62 68.5,63.5 66.5,63.5 L 28,63.5 C 26.5,63.5 26,62 26,60 Z" 
          fill="#FFFFFF"/>

    <!-- Sloped Windshield Cutout -->
    <path d="M 58,37.5 L 65.5,47 L 58,47 Z" fill="#FF5722"/>

    <!-- Serving Window Hatch -->
    <rect x="32" y="38" width="18" height="13" rx="2" fill="#1E1E24"/>

    <!-- Warm Golden Awning -->
    <path d="M 30,38 L 52,38 L 50,34.5 L 32,34.5 Z" fill="url(#truckSpotGoldGrad)"/>

    <!-- Serving Counter Warm Light -->
    <circle cx="41" cy="46" r="2.8" fill="url(#truckSpotGoldGrad)"/>

    <!-- Rear Wheel with Rim Accent -->
    <circle cx="36" cy="63.5" r="6.5" fill="#1E1E24"/>
    <circle cx="36" cy="63.5" r="2.5" fill="url(#truckSpotGoldGrad)"/>

    <!-- Front Wheel with Rim Accent -->
    <circle cx="60" cy="63.5" r="6.5" fill="#1E1E24"/>
    <circle cx="60" cy="63.5" r="2.5" fill="url(#truckSpotGoldGrad)"/>

    <!-- Top GPS Radar Beacon Dot -->
    <circle cx="50" cy="18" r="4.5" fill="#FFFFFF"/>
    <circle cx="50" cy="18" r="2" fill="#FFC107"/>
  </g>

  <!-- ================= TYPOGRAPHY: "TRUCK SPOT" ================= -->
  <g transform="translate(136, 28)">
    <!-- Primary Wordmark: Bold Geometric Contrast -->
    <text x="0" y="48" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-weight="900" font-size="48" letter-spacing="-1.8" fill="#1E1E24">
      TRUCK <tspan fill="#FF5722">SPOT</tspan>
    </text>

    <!-- Subtitle / Tagline: Generous optical spacing -->
    <text x="3" y="76" font-family="'JetBrains Mono', 'Plus Jakarta Sans', monospace" font-weight="700" font-size="11" letter-spacing="3.8" fill="#718096">
      REAL-TIME FOOD RADAR
    </text>

    <!-- Energetic Spark Accent -->
    <circle cx="328" cy="42" r="4.5" fill="#FF5722"/>
  </g>
</svg>