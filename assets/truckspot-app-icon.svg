<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="iconBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1E24"/>
      <stop offset="100%" stop-color="#0E0E12"/>
    </linearGradient>
    <linearGradient id="iconPinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7043"/>
      <stop offset="100%" stop-color="#FF5722"/>
    </linearGradient>
    <linearGradient id="iconYellowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD54F"/>
      <stop offset="100%" stop-color="#FFC107"/>
    </linearGradient>
    <filter id="iconGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#FF5722" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- App Squircle Base -->
  <rect x="0" y="0" width="512" height="512" rx="115" fill="url(#iconBgGrad)"/>
  
  <!-- Subtle Inner Border -->
  <rect x="4" y="4" width="504" height="504" rx="111" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="4"/>

  <!-- Centered Scaled Pin (Scale 3.8x, centered at 256, 256) -->
  <g transform="translate(66, 60)" filter="url(#iconGlow)">
    <!-- Scaled Pin Path (from 100x100 to 380x380) -->
    <path d="M 190,15.2 C 112.1,15.2 49.4,77.9 49.4,155.8 C 49.4,243.2 174,351.9 183.2,359.9 C 187.3,363.3 192.7,363.3 196.8,359.9 C 206,351.9 330.6,243.2 330.6,155.8 C 330.6,77.9 267.9,15.2 190,15.2 Z" 
          fill="url(#iconPinGrad)"/>

    <!-- Negative Space Food Truck -->
    <path d="M 98.8,144.4 C 98.8,133 106.4,125.4 117.8,125.4 L 212.8,125.4 C 222.3,125.4 229.9,131.1 233.7,138.7 L 260.3,172.9 C 264.1,177.8 266,183.2 266,190 L 266,228 C 266,235.6 260.3,241.3 252.7,241.3 L 106.4,241.3 C 100.7,241.3 98.8,235.6 98.8,228 Z" 
          fill="#FFFFFF"/>

    <!-- Windshield -->
    <path d="M 220.4,142.5 L 248.9,178.6 L 220.4,178.6 Z" fill="#FF5722"/>

    <!-- Serving Window Hatch -->
    <rect x="121.6" y="144.4" width="68.4" height="49.4" rx="7.6" fill="#1E1E24"/>

    <!-- Golden Awning -->
    <path d="M 114,144.4 L 197.6,144.4 L 190,131.1 L 121.6,131.1 Z" fill="url(#iconYellowGrad)"/>

    <!-- Counter Indicator -->
    <circle cx="155.8" cy="174.8" r="10.6" fill="url(#iconYellowGrad)"/>

    <!-- Rear Wheel -->
    <circle cx="136.8" cy="241.3" r="24.7" fill="#1E1E24"/>
    <circle cx="136.8" cy="241.3" r="9.5" fill="url(#iconYellowGrad)"/>

    <!-- Front Wheel -->
    <circle cx="228" cy="241.3" r="24.7" fill="#1E1E24"/>
    <circle cx="228" cy="241.3" r="9.5" fill="url(#iconYellowGrad)"/>

    <!-- Beacon Light -->
    <circle cx="190" cy="68.4" r="17.1" fill="#FFFFFF"/>
    <circle cx="190" cy="68.4" r="7.6" fill="#FFC107"/>
  </g>
</svg>